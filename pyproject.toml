
[project]
name = "restockiq"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "holidays>=0.50",
    "pymongo>=4.6.0",
    "motor>=3.3.0",
    "google-genai>=0.1.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[tool.vercel]
entrypoint = "website.main:app"
