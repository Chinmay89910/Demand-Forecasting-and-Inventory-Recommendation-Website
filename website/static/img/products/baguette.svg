<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="bread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="80%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="score" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <g transform="translate(10, 10)">
    <!-- Shadow -->
    <ellipse cx="50" cy="88" rx="40" ry="7" fill="#78350F" opacity="0.15"/>
    <!-- Baguette body diagonally -->
    <path d="M 18,78 C 12,72 15,60 26,48 L 68,16 C 78,8 88,12 90,20 C 92,28 86,40 76,52 L 34,84 C 24,92 20,86 18,78 Z" fill="url(#bread)"/>
    <!-- Baker slash cuts (scores) -->
    <ellipse cx="36" cy="62" rx="7" ry="2.5" transform="rotate(-15 36 62)" fill="url(#score)"/>
    <ellipse cx="52" cy="46" rx="7" ry="2.5" transform="rotate(-15 52 46)" fill="url(#score)"/>
    <ellipse cx="68" cy="32" rx="7" ry="2.5" transform="rotate(-15 68 32)" fill="url(#score)"/>
    <!-- Flour dusting highlights -->
    <circle cx="44" cy="54" r="1.5" fill="#FFFBEB" opacity="0.8"/>
    <circle cx="60" cy="38" r="1.5" fill="#FFFBEB" opacity="0.8"/>
    <circle cx="28" cy="70" r="1.5" fill="#FFFBEB" opacity="0.8"/>
    <circle cx="76" cy="24" r="1.5" fill="#FFFBEB" opacity="0.8"/>
  </g>
</svg>
