<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgMuff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="muffTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="muffCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bgMuff)"/>
  <g transform="translate(10, 10)">
    <!-- Shadow -->
    <ellipse cx="50" cy="88" rx="34" ry="7" fill="#3E2723" opacity="0.2"/>
    <!-- Paper cup -->
    <polygon points="30,56 70,56 64,86 36,86" fill="url(#muffCup)"/>
    <!-- Pleat lines on cup -->
    <line x1="38" y1="56" x2="42" y2="86" stroke="#8D6E63" stroke-width="1.2"/>
    <line x1="46" y1="56" x2="48" y2="86" stroke="#8D6E63" stroke-width="1.2"/>
    <line x1="54" y1="56" x2="52" y2="86" stroke="#8D6E63" stroke-width="1.2"/>
    <line x1="62" y1="56" x2="58" y2="86" stroke="#8D6E63" stroke-width="1.2"/>
    <!-- Muffin mushroom top -->
    <path d="M 22,56 C 18,40 30,22 50,22 C 70,22 82,40 78,56 C 74,62 66,62 50,62 C 34,62 26,62 22,56 Z" fill="url(#muffTop)"/>
    <!-- Chocolate chips -->
    <circle cx="36" cy="38" r="3.5" fill="#1D120D"/>
    <circle cx="50" cy="30" r="4" fill="#1D120D"/>
    <circle cx="64" cy="40" r="3.5" fill="#1D120D"/>
    <circle cx="48" cy="46" r="3" fill="#1D120D"/>
    <circle cx="32" cy="50" r="2.5" fill="#1D120D"/>
    <circle cx="68" cy="50" r="2.5" fill="#1D120D"/>
  </g>
</svg>
