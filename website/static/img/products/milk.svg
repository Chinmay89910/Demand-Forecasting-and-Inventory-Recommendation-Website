<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <g transform="translate(10, 10)">
    <!-- Shadow -->
    <ellipse cx="50" cy="90" rx="28" ry="6" fill="#0369A1" opacity="0.15"/>
    <!-- Bottle Cap -->
    <rect x="42" y="14" width="16" height="8" rx="2" fill="#0284C7"/>
    <!-- Bottle Neck -->
    <path d="M 44,22 L 44,32 L 30,46 L 30,84 C 30,88 34,90 38,90 L 62,90 C 66,90 70,88 70,84 L 70,46 L 56,32 L 56,22 Z" fill="url(#bottle)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Milk Wave inside bottle -->
    <path d="M 32,56 Q 42,52 50,56 T 68,54 L 68,84 C 68,87 65,88 62,88 L 38,88 C 35,88 32,87 32,84 Z" fill="#F8FAFC"/>
    <!-- Blue Label -->
    <rect x="30" y="62" width="40" height="18" rx="2" fill="url(#label)"/>
    <text x="50" y="74" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MILK</text>
    <path d="M 42,77 L 58,77" stroke="#BAE6FD" stroke-width="1" stroke-linecap="round"/>
    <!-- Glass Highlight Reflection -->
    <path d="M 34,48 L 34,84" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
