<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBE6"/>
      <stop offset="100%" stop-color="#E6D7CF"/>
    </linearGradient>
    <linearGradient id="bean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1B14"/>
    </linearGradient>
    <linearGradient id="beanLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="70%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <g transform="translate(10, 10)">
    <!-- Shadow -->
    <ellipse cx="50" cy="85" rx="36" ry="7" fill="#2D1B14" opacity="0.2"/>
    <!-- Bean 1 (Tilted left) -->
    <g transform="translate(26, 32) rotate(-25 18 24)">
      <ellipse cx="18" cy="24" rx="16" ry="24" fill="url(#beanLight)"/>
      <path d="M 18,3 C 23,12 13,24 18,45" stroke="#1D120D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Highlight -->
      <ellipse cx="12" cy="18" rx="4" ry="10" fill="#A1887F" opacity="0.4"/>
    </g>
    <!-- Bean 2 (Tilted right, in front) -->
    <g transform="translate(48, 38) rotate(30 18 24)">
      <ellipse cx="18" cy="24" rx="16" ry="24" fill="url(#bean)"/>
      <path d="M 18,3 C 23,12 13,24 18,45" stroke="#1D120D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Highlight -->
      <ellipse cx="12" cy="18" rx="4" ry="10" fill="#8D6E63" opacity="0.4"/>
    </g>
    <!-- Steam aroma swirls -->
    <path d="M 44,22 Q 41,15 47,10" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 54,20 Q 58,13 53,8" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
