<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130">
  <defs>
    <!-- Background Bakery Ambient Glow -->
    <linearGradient id="ovenGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c0f03"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="75%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Warm Light Halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Rustic Wood Board -->
    <linearGradient id="woodBoard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="25%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#270e02"/>
    </linearGradient>

    <!-- Golden Sourdough Crust -->
    <linearGradient id="breadCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Flaky Croissant Gold -->
    <linearGradient id="croissantGold" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Baguette Golden Gradient -->
    <linearGradient id="baguetteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Flour Dust Texture -->
    <linearGradient id="flourDust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Wheat Gold -->
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Bakery Oven Background -->
  <rect width="300" height="130" fill="url(#ovenGlow)"/>

  <!-- Warm Oven Ambient Light -->
  <circle cx="160" cy="55" r="95" fill="url(#halo)"/>
  <circle cx="70" cy="40" r="60" fill="url(#halo)" opacity="0.6"/>

  <!-- Bakery Shelf / Wooden Counter -->
  <path d="M 0,96 L 300,96 L 300,130 L 0,130 Z" fill="url(#woodBoard)"/>
  <line x1="0" y1="96" x2="300" y2="96" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="98" x2="300" y2="98" stroke="#000000" stroke-width="1" opacity="0.4"/>

  <!-- Wheat Stalks (Left Background) -->
  <g transform="translate(18, 20) rotate(-18)" opacity="0.45">
    <line x1="15" y1="90" x2="15" y2="15" stroke="url(#wheatGold)" stroke-width="2"/>
    <!-- Grains -->
    <ellipse cx="11" cy="22" rx="4" ry="7" transform="rotate(-30 11 22)" fill="url(#wheatGold)"/>
    <ellipse cx="19" cy="22" rx="4" ry="7" transform="rotate(30 19 22)" fill="url(#wheatGold)"/>
    <ellipse cx="11" cy="34" rx="4.5" ry="7.5" transform="rotate(-30 11 34)" fill="url(#wheatGold)"/>
    <ellipse cx="19" cy="34" rx="4.5" ry="7.5" transform="rotate(30 19 34)" fill="url(#wheatGold)"/>
    <ellipse cx="11" cy="46" rx="4.5" ry="7.5" transform="rotate(-30 11 46)" fill="url(#wheatGold)"/>
    <ellipse cx="19" cy="46" rx="4.5" ry="7.5" transform="rotate(30 19 46)" fill="url(#wheatGold)"/>
    <ellipse cx="11" cy="58" rx="4" ry="7" transform="rotate(-30 11 58)" fill="url(#wheatGold)"/>
    <ellipse cx="19" cy="58" rx="4" ry="7" transform="rotate(30 19 58)" fill="url(#wheatGold)"/>
  </g>

  <!-- Crispy Traditional Baguettes (Tilted in Background) -->
  <g transform="translate(180, 24) rotate(22)">
    <!-- Shadow -->
    <ellipse cx="40" cy="85" rx="35" ry="6" fill="#000000" opacity="0.4"/>
    <!-- Baguette 1 Body -->
    <rect x="25" y="-10" width="22" height="100" rx="11" fill="url(#baguetteGold)" transform="rotate(-8 36 40)"/>
    <!-- Baker Scored Cuts (Grignes) -->
    <path d="M 28,12 C 34,16 38,20 42,28" stroke="#713f12" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 29,32 C 35,36 39,40 43,48" stroke="#713f12" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 30,52 C 36,56 40,60 44,68" stroke="#713f12" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 28,12 C 34,16 38,20 42,28" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 29,32 C 35,36 39,40 43,48" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Artisanal Sourdough Boule (Center Left) -->
  <g id="sourdough-boule">
    <!-- Bread Cast Shadow -->
    <ellipse cx="105" cy="104" rx="55" ry="12" fill="#000000" opacity="0.5"/>
    
    <!-- Crust Dome -->
    <path d="M 52,100 C 50,68 76,46 108,46 C 140,46 164,68 162,100 C 160,105 54,105 52,100 Z" fill="url(#breadCrust)"/>
    
    <!-- Bread Bloom / Scored Ear Opening -->
    <path d="M 68,78 C 88,58 126,58 146,76 C 128,66 86,66 68,78 Z" fill="#fde68a"/>
    <path d="M 72,76 C 90,62 122,62 142,74" stroke="#78350f" stroke-width="2.5" fill="none"/>
    
    <!-- Secondary Crust Cuts -->
    <path d="M 64,88 C 76,80 88,80 96,86" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 118,86 C 126,80 138,80 150,88" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Flour Dusting on Top Dome -->
    <ellipse cx="108" cy="54" rx="26" ry="7" fill="url(#flourDust)"/>
    <ellipse cx="82" cy="64" rx="14" ry="5" fill="url(#flourDust)" opacity="0.5"/>
  </g>

  <!-- Fresh Golden Croissant (Foreground Right) -->
  <g id="fresh-croissant" transform="translate(155, 62)">
    <!-- Shadow -->
    <ellipse cx="58" cy="42" rx="42" ry="8" fill="#000000" opacity="0.45"/>
    
    <!-- Main Crescent Body -->
    <path d="M 12,38 C 16,14 42,-2 62,-2 C 82,-2 106,14 110,38 C 102,46 88,38 62,38 C 36,38 20,46 12,38 Z" fill="url(#croissantGold)"/>
    
    <!-- Inner Flaky Roll Layers -->
    <path d="M 26,34 C 32,16 48,6 62,6 C 76,6 92,16 98,34 C 88,38 76,32 62,32 C 48,32 36,38 26,34 Z" fill="#f59e0b"/>
    <path d="M 38,30 C 44,18 54,12 62,12 C 70,12 80,18 86,30 C 78,33 70,28 62,28 C 54,28 46,33 38,30 Z" fill="#fbbf24"/>
    
    <!-- Glaze Highlights -->
    <ellipse cx="62" cy="15" rx="14" ry="4" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="44" cy="22" rx="6" ry="2.5" transform="rotate(-20 44 22)" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="80" cy="22" rx="6" ry="2.5" transform="rotate(20 80 22)" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Ambient Steam & Floating Flour Dust Particles -->
  <g opacity="0.6">
    <circle cx="95" cy="40" r="1.5" fill="#fff" opacity="0.6"/>
    <circle cx="130" cy="35" r="1" fill="#fff" opacity="0.4"/>
    <circle cx="170" cy="48" r="1.2" fill="#fff" opacity="0.5"/>
    <circle cx="210" cy="38" r="1.8" fill="#fff" opacity="0.4"/>
    <circle cx="65" cy="50" r="1" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Elegant Artisanal Label Overlay (Bottom Left Badge) -->
  <rect x="10" y="10" width="112" height="20" rx="10" fill="#000000" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="20" cy="20" r="3.5" fill="#10b981"/>
  <text x="30" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#fef3c7" letter-spacing="0.5">ARTISAN BAKEHOUSE</text>
</svg>
